; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitc-02]
platform = espressif32
board = esp32-c3-devkitc-02
framework = espidf
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200  ;The baudrate defines the speed of serial communication between the computer and the microcontroller
lib_extra_dirs = lib

; Configuración de memoria flash
board_build.flash_size = 4MB
board_upload.maximum_size = 4194304  ; 4MB en bytes

board_build.partitions = max_app_4MB.csv

[env:native]
platform = native
build_type = debug
monitor_speed = 115200
lib_extra_dirs = lib
lib_ignore = 
    external_interface
    sensor_manager
    database